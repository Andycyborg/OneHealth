{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        OneHealth
        {% endblock %}
    </title>

    

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

    <header class="navbar">

       <div class="logo" style="display: flex; align-items: center; justify-content: center;">
    <a href="{% url 'home' %}" style="display: block; text-decoration: none;">
        <img
            src="{% static 'images/onehealth_logo.png' %}"
            alt="OneHealth: Unified Health Intelligence Platform"
            style="height: 80px; width: auto; display: block; max-width: 100%; border: none;"
        >
    </a>
</div>

        <nav>

            <a href="{% url 'home' %}">
                Home
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'accounts:dashboard_redirect' %}">
                    Dashboard
                </a>

                <a href="{% url 'accounts:logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'accounts:login' %}">
                    Login
                </a>

                <a href="{% url 'accounts:register' %}">
                    Register
                </a>

            {% endif %}

        </nav>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            <pre>© 2026 OneHealth byAndy </pre>
        </p>

    </footer>

</body>

</html>
