{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        OneHealth
        {% endblock %}
    </title>

    

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>

    <header class="navbar">

       <div class="logo">
    <a href="{% url 'home' %}" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none;">
        <img
            src="{% static 'images/onehealth_logo.png' %}"
            alt="OneHealth: Unified Health Intelligence Platform"
            style="height: 80px; width: auto; max-width: 100%; border: none;"
        >
        <span class="brand-name" style="font-size: 28px; font-weight: bold; color: #1aa02c;">OneHealth</span>
    </a>
</div>

        <nav>

            <a href="{% url 'home' %}" class="btn-secondary" style="background-color: #155EEF; color: white;">
                Home
            </a>
            

            {% if user.is_authenticated %}

                <a href="{% url 'accounts:dashboard_redirect' %}" class="btn-secondary" style="background-color: #155EEF; color: white;">
                    Dashboard
                </a>
                <a href="{% url 'hospitals:list' %}"
            class="btn-secondary" style="background-color: #155EEF; color: white;">
                Find Hospital
            </a>

                <a href="{% url 'accounts:logout' %}" class="btn-secondary" style="background-color: #155EEF; color: white;">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'accounts:login' %}" class="btn-secondary" style="background-color:#155EEF; color: white;" >
                    Login
                </a>

                <a href="{% url 'accounts:register' %}" class="btn-secondary" style="background-color:#155EEF; color: white;">
                    Register
                </a>

            {% endif %}

        </nav>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            <pre>© 2026 OneHealth byAndy </pre>
        </p>

    </footer>

</body>

</html>
